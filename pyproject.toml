[project]
name = "geomet-sampler"
version = "0.1.0"
description = "Select drill core intervals for geometallurgical testwork"
readme = "README.md"
license = "MIT"
authors = [{ name = "Alex", email = "al.chojno@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "xlsxwriter>=3.2",
    "matplotlib>=3.8",
]

[project.urls]
Repository = "https://github.com/ac-geol/geomet-sampler"

[project.scripts]
geomet-sampler = "geomet_sampler.cli:app"

[dependency-groups]
dev = [
    "openpyxl>=3.1",   # reading xlsx back in tests; xlsxwriter only writes
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geomet_sampler"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
# B008: typer declares CLI defaults by calling typer.Option in the signature.
# N812: `from geomet_sampler import models as M` is the project convention for the
#       canonical schema namespace, so canonical field names read as M.HOLE_ID.
ignore = ["B008", "N812"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/geomet_sampler"]
