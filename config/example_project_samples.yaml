# Example project config: single desurveyed samples table.
#
# Same project as example_project.yaml, but the drillhole data arrive as one table that
# has already been desurveyed, instead of separate collar, survey, assay and litho files.
# Everything else (block model, domain lookup, availability, testwork) is unchanged.
#
# Every column name in this file belongs to the user's data, not to the tool. The
# library never sees these names: the readers map them onto the canonical schema at
# load, and everything downstream works in canonical names only.
#
# This config plus the input CSVs is a complete, reproducible record of how a sample
# list was produced. A hash of this file is written into every output.

project:
  name: Demo Geomet Programme
  crs: null                       # CONFIRM: set to the project CRS; example data is a local grid
  output_dir: ../output/samples_table

conventions:
  length_units: m                 # m | ft
  # dip_convention is not needed: the table carries coordinates, not dips. Add it
  # (negative_down | positive_down) only if planned_collar/planned_survey are supplied.
  azimuth_reference: grid         # grid | true
  magnetic_declination_deg: 0.0   # applied only when azimuth_reference: true
  density_units: t_m3             # t_m3 | g_cm3 | lb_ft3

# ---------------------------------------------------------------- data sources
sources:

  # One desurveyed table in place of collar, survey, assay and litho. Every row
  # carries its depths, logged code and from/to/mid coordinates. Rows with no assays
  # (unsampled core) are kept with blank grades; a blank SampleID gets a generated ID.
  samples:
    path: ../data/DEMO_Samples_Desurveyed_0001.csv
    encoding: auto
    columns:
      hole_id: HoleID
      sample_id: SampleID
      from_m: From_m
      to_m: To_m
      logged_code: Lith
      x_from: X_From
      y_from: Y_From
      z_from: Z_From
      x_to: X_To
      y_to: Y_To
      z_to: Z_To
      x_mid: X_Mid
      y_mid: Y_Mid
      z_mid: Z_Mid
    null_values: []               # text meaning "no value", e.g. [NS, IS, -99]. Only an
                                  # empty cell is blank otherwise; other text is an ERROR
    negative_is_below_detection: false  # true if -0.01 means <0.01; else negative grades
                                        # are an ERROR. <0.01 always reads as half the limit
    density:
      source: BD_tonnes_m3
      fallback_constant: 2.70
    flags:
      low_recovery:
        source: LowRecovery
        type: boolean
        true_values: [Y, "1", TRUE, "true"]

  domain_lookup:
    path: ../data/domain_lookup.csv
    columns:
      logged_code: logged_code
      geomet_domain: geomet_domain

  block_model:
    path: ../data/block_model_periods.csv
    columns:
      x: X
      y: Y
      z: Z
      dx: DX
      dy: DY
      dz: DZ
      period: PERIOD
    null_values: []               # text meaning "no value", e.g. [NS, IS, -99]. Only an
                                  # empty cell is blank otherwise; other text is an ERROR
    negative_is_below_detection: false  # true if -0.01 means <0.01; else negative grades
                                        # are an ERROR. <0.01 always reads as half the limit
    density:
      source: DENSITY
      fallback_constant: 2.70

  availability:
    path: ../data/hole_availability.csv
    columns:
      hole_id: hole_id
      availability: availability
      core_diameter_mm: core_diameter_mm
      remaining_fraction: remaining_fraction
    value_map:
      AVAILABLE: [AVAILABLE, YES, Y, IN STORAGE]
      UNAVAILABLE: [UNAVAILABLE, NO, N, DISPOSED, CONSUMED]
      PLANNED: [PLANNED, PROPOSED, FUTURE]

  existing_testwork:
    path: ../data/existing_testwork.csv
    columns:
      sample_id: sample_id
      hole_id: HoleID
      from_m: from_m
      to_m: to_m
      geomet_domain: null         # null -> derived from the recorded depths
      test_package: test_package

  planned_collar: null
  planned_survey: null

# ------------------------------------------------------- user-declared fields
# Role names on the left are invented by the user. `hard_break_on` and
# `allocation_key` reference them. Nothing in the code enumerates these.
attributes:
  weathering:
    block_model: WEATHERING
    drillhole: null               # not logged in this dataset
  rock_type:
    block_model: ROCKTYPE
    drillhole: null
  resource_class:
    block_model: CLASS
    drillhole: null

elements:
  Zn:
    primary: true                 # exactly one element must be primary
    drillhole: {field: Zn_pct, units: pct}
    block_model: {field: ZN_PCT, units: pct}
  Pb:
    drillhole: {field: Pb_pct, units: pct}
    block_model: {field: null, units: null}
  Ag:
    drillhole: {field: Ag_ppm, units: ppm}
    block_model: {field: AG_GPT, units: gpt}

# ---------------------------------------------------------------- processing
domaining:
  # The block model role whose vocabulary should agree with the logged geomet_domain.
  # Leave null and the tool will not guess a correspondence, and domain_match stays blank.
  domain_match_attribute: rock_type
  hard_break_on:
    - geomet_domain
    - weathering
  max_interval_gap_m: 0.10
  break_on_low_recovery: true
  break_on_missing_primary_grade: true

  allocation_key:
    - rock_type
    - weathering
    - grade_bin
  grade_bins:
    element: Zn
    source: drillhole             # bin candidates on their own assays
    edges: [0.0, 2.0, 5.0, 999.0]
    labels: [LOW, MED, HIGH]

compositing:
  min_length_m: 6.0
  max_length_m: 30.0
  target_mass_kg: 50.0
  min_mass_kg: 40.0
  allow_multi_hole: false
  max_cv_primary: 1.0
  require_grade_bin_match: true

mass:
  default_core_diameter_mm: 63.5
  default_remaining_fraction: 0.5
  loss_factor: 0.90               # PLACEHOLDER: calibrate against past programmes
  prior_testwork_core: exclude    # exclude | available: see SPEC 5.6

allocation:
  method: neyman                  # proportional | neyman | manual
  total_samples: 40
  min_samples_per_domain: 2
  min_domain_tonnage_pct: 1.0
  risk_multipliers: {}            # e.g. VOLCANIC-OXIDE-HIGH: 1.5
  period_weights:
    1: 3.0
    2: 2.5
    3: 2.0
    4: 1.5
    default: 1.0

selection:
  method: greedy_with_swap
  max_samples_per_hole: 3
  min_separation_m: 50.0
  swap_iterations: 200
  random_seed: 42

reporting:
  formats: [xlsx, csv]
  include_gap_register: true
  include_plots: true
